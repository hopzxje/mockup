services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stayhub-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=StayHubPassword_2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'StayHubPassword_2026!' -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mssql_data:
